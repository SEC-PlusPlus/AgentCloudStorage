server {
    listen 80;
    listen [::]:80;
    server_name secplusplus.xyz www.secplusplus.xyz;

    root /opt/agentcloudstorage/web/dist;
    index index.html;
    client_max_body_size 2g;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # P2 SSE 依赖（Task 12）：关闭响应缓冲，逐 delta 下发流式帧；
        # 读超时 120s 覆盖最长档（本地兜底模型 120s，agent 档 60s 已含在内），
        # 满足 spec §7 "≥90s" 约束。上线随 React 前端 SSE 开放一并执行。
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
