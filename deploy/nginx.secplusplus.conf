server {
    listen 80;
    listen [::]:80;
    server_name secplusplus.xyz www.secplusplus.xyz;

    root /opt/agentcloudstorage/web/dist;
    index index.html;
    client_max_body_size 2g;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # P2 SSE 依赖（Task 12）：流式逐 delta 下发需要的是 proxy_buffering off，而非改超时；
        # proxy_read_timeout 维持原值 300s——既已满足 spec §7 "≥90s" 约束，
        # 又覆盖 composite 串行兜底最坏 60s(agent)+120s(local)=180s 且留有余量。
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
