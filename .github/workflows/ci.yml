name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧运行在有新提交时自动取消，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # -race 是本项目的重点：Answerer 复合层与 SSE 通道都是并发代码
      - run: go test -race ./... -count=1

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      # requirements.txt 是 pip freeze 锁定的精确版本（Task 7），CI 直接复现本地环境
      - run: pip install -r requirements.txt
        working-directory: agent
      # 全部测试经 httpx.MockTransport 走假 LLM，CI 无需任何密钥或外网调用
      - run: python -m pytest tests -q
        working-directory: agent

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 已知欠账：本地 Windows + ~/.npmrc 镜像钉死生成的 lockfile 与 Linux 平台树
      # （@emnapi 2.0.0-beta.* 等可选依赖）不同步，npm ci 在 runner 上报 EUSAGE。
      # 先用 npm install 现场对齐收敛 CI；根治 = 在 node:24 linux 环境重生成一次 lockfile
      # 并恢复 npm ci（见 web/docs 待办，或调整本地 ~/.npmrc 的 registry 钉死）。
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
