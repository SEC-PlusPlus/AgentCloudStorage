name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧运行在有新提交时自动取消，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # -race 是本项目的重点：Answerer 复合层与 SSE 通道都是并发代码
      - run: go test -race ./... -count=1

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      # requirements.txt 是 pip freeze 锁定的精确版本（Task 7），CI 直接复现本地环境
      - run: pip install -r requirements.txt
        working-directory: agent
      # 全部测试经 httpx.MockTransport 走假 LLM，CI 无需任何密钥或外网调用
      - run: python -m pytest tests -q
        working-directory: agent

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 本机 ~/.npmrc 钉死了 registry.npmmirror.com，未来重新 npm install 可能把 mirror URL
      # 写回 lockfile；这里兜底归一化回官方源（海外 runner 访问 mirror 会挂 npm ci）
      - run: sed -i 's#https://registry.npmmirror.com#https://registry.npmjs.org#g' package-lock.json
        working-directory: web
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
