# Local development defaults. Copy this file to config.yaml before starting the Go server.
# Keep passwords and JWT keys in environment variables, not in this YAML file.
server:
  addr: ":8080"

mysql:
  host: 127.0.0.1
  port: 3307
  user: xxx
  database: xxx
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_idle_time: 30m

redis:
  addr: 127.0.0.1:6380
  db: 0

minio:
  endpoint: 127.0.0.1:9000
  bucket: xxx
  use_ssl: false

jwt:
  issuer: govault
  access_ttl: 2h
ai:
  base_url: https://open.bigmodel.cn/api/paas/v4
  model: glm-5.3-flash
  api_key: xxx
# 拆分出去的 Python agent 服务（P1 远端模式）。留空 base_url 则走本地内置问答路径。
# 环境变量覆盖：AGENT_BASE_URL / AGENT_API_KEY / AGENT_TIMEOUT。
# api_key 必须与 agent 侧 AGENT_INTERNAL_TOKEN 一致；timeout 默认 60s，
# 须大于 agent 侧 LLM_TIMEOUT（45s），否则已计费的 LLM 调用会被 Go 侧提前掐断。
# agent:
#   base_url: http://127.0.0.1:8001
#   api_key: xxx
#   timeout: 60s