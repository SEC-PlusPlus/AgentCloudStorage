# Local development defaults. Copy this file to config.yaml before starting the Go server.
# Keep passwords and JWT keys in environment variables, not in this YAML file.
server:
  addr: ":8080"

mysql:
  host: 127.0.0.1
  port: 3307
  user: xxx
  database: xxx
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_idle_time: 30m

redis:
  addr: 127.0.0.1:6380
  db: 0

minio:
  endpoint: 127.0.0.1:9000
  bucket: xxx
  use_ssl: false

jwt:
  issuer: govault
  access_ttl: 2h
ai:
  base_url: https://open.bigmodel.cn/api/paas/v4
  model: glm-5.3-flash
  api_key: xxx